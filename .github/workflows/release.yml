name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 1. Build wheels ──────────────────────────────────────────────────────────
  build_wheels:
    name: Build wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # versioneer needs full history to resolve the tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./wheelhouse/*.whl

  # ── 2. Build sdist ───────────────────────────────────────────────────────────
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist
        run: |
          python -m pip install build versioneer
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ── 3. Check distribution ────────────────────────────────────────────────────
  check_dist:
    name: Check distribution
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # needed for README.rst

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Check README markup
        run: |
          python -m pip install docutils
          python -m docutils README.rst > /dev/null

      - name: Twine check
        run: |
          python -m pip install twine
          twine check dist/*

  # ── 4. Publish to PyPI ───────────────────────────────────────────────────────
  publish_pypi:
    name: Publish to PyPI
    needs: check_dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cubnm
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── 5. GitHub release ────────────────────────────────────────────────────────
  github_release:
    name: Create GitHub release
    needs: publish_pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}

  # ── 6. Build and push Docker image ───────────────────────────────────────────
  # The image pulls cubnm from PyPI, so this job runs after publish_pypi.
  build_docker:
    name: Build and push Docker image
    needs: publish_pypi
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" =~ rc|alpha|beta ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/stable/Dockerfile
          push: true
          build-args: VER=${{ steps.version.outputs.version }}
          tags: |
            amnsbr/cubnm:v${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.is_prerelease == 'false' && 'amnsbr/cubnm:latest' || '' }}
